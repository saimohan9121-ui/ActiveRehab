<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 130" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Brand Color Gradients -->
    <linearGradient id="arBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2E4386"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="arOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="50%" stop-color="#FAA41A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="arTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Filter for soft modern depth shadow -->
    <filter id="arShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>

    <style>
      .logo-title-active { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 54px; fill: #1E3A8A; letter-spacing: -0.5px; }
      .logo-title-rehab { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 54px; fill: #FAA41A; letter-spacing: -0.5px; }
      .logo-title-centre { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 32px; fill: #1E3A8A; letter-spacing: 3px; }
      .logo-subtitle { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #475569; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- MAIN LOGO CONTAINER -->
  <g filter="url(#arShadow)">
    
    <!-- ICON EMBLEM: Spinal Vertebrae + Active Figure + Protective Arc -->
    <g transform="translate(15, 10)">
      <!-- Outer Support Arc (Blue) -->
      <path d="M 40 100 C 15 85 8 52 24 30 C 36 14 58 8 75 18 C 62 24 46 36 41 52 C 36 68 43 85 54 95 Z" fill="url(#arBlueGrad)"/>

      <!-- Spine Vertebrae Nodes (Graduated Alignment Dots) -->
      <circle cx="60" cy="88" r="5" fill="url(#arOrangeGrad)"/>
      <circle cx="62" cy="74" r="5.5" fill="url(#arOrangeGrad)"/>
      <circle cx="67" cy="60" r="6" fill="url(#arOrangeGrad)"/>
      <circle cx="75" cy="46" r="6.5" fill="url(#arOrangeGrad)"/>

      <!-- Active Rehabilitation Human Curve (Motion Spine Arc) -->
      <path d="M 56 90 C 58 72 68 53 80 40 C 90 29 103 22 112 20 C 102 27 91 38 82 52 C 73 65 64 80 60 91 Z" fill="url(#arOrangeGrad)"/>

      <!-- Arms / Energy Sweep Arc -->
      <path d="M 72 47 C 83 39 96 36 107 38 C 96 43 85 50 77 58 Z" fill="url(#arBlueGrad)" opacity="0.9"/>

      <!-- Human Figure Head (Vitality Sphere) -->
      <circle cx="114" cy="16" r="9.5" fill="url(#arOrangeGrad)"/>

      <!-- Base Recovery Swoosh (Aqua Accent) -->
      <path d="M 24 72 C 33 90 52 107 80 109 C 100 110 116 100 122 91 C 111 100 94 104 77 102 C 54 99 37 86 29 71 Z" fill="url(#arTealGrad)"/>
    </g>

    <!-- LOGO TEXT CONTENT -->
    <g transform="translate(155, 5)">
      <!-- MAIN BRAND NAME -->
      <text x="0" y="64" class="logo-title-active">Active</text>
      <text x="168" y="64" class="logo-title-rehab">Rehab</text>
      <text x="338" y="64" class="logo-title-centre">CENTRE</text>

      <!-- TAGLINE / CLINICAL CATEGORY -->
      <text x="2" y="96" class="logo-subtitle">CHIROPRACTIC &amp; REHABILITATION</text>

      <!-- DESIGN ACCENT LINE -->
      <rect x="2" y="104" width="445" height="4" rx="2" fill="url(#arOrangeGrad)"/>
    </g>
  </g>
</svg>
